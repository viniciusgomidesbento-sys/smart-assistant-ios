name: iOS App Cloud Build (Free macOS Runner)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Swift Package on Cloud Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show macOS and Xcode Info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build Swift Package
        run: |
          echo "Compilando código Swift no macOS Cloud Runner..."
          swift build -v

      - name: Run Swift Package Tests
        run: |
          echo "Executando suite de testes automatizados..."
          swift test -v